name: Autocasion

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Que quieres hacer"
        type: choice
        default: diagnostico
        options:
          - diagnostico
          - simular
          - publicar
      limite:
        description: "Probar solo con los primeros N coches (vacio = todos)"
        required: false
        default: ""

  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  autocasion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recuperar la cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: autocasion-${{ github.run_id }}
          restore-keys: autocasion-

      - name: Generar el stock al dia
        run: python extraer_stock.py

      - name: Decidir que se hace
        id: modo
        run: |
          MODO="${{ github.event.inputs.modo }}"
          if [ -z "$MODO" ]; then MODO="publicar"; fi

          ARGS=""
          case "$MODO" in
            diagnostico) ARGS="--diagnostico" ;;
            simular)     ARGS="--simular" ;;
            publicar)    ARGS="" ;;
          esac

          LIMITE="${{ github.event.inputs.limite }}"
          if [ -n "$LIMITE" ]; then ARGS="$ARGS --limite $LIMITE"; fi

          echo "modo=$MODO" >> $GITHUB_OUTPUT
          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Se va a ejecutar en modo: $MODO"

      - name: Autocasion
        env:
          SUMAUTO_USUARIO: ${{ secrets.SUMAUTO_USUARIO }}
          SUMAUTO_CLAVE: ${{ secrets.SUMAUTO_CLAVE }}
          SUMAUTO_PRUEBAS: ${{ vars.SUMAUTO_PRUEBAS }}
        run: python autocasion.py ${{ steps.modo.outputs.args }}

      - name: Guardar el resultado
        if: always()
        run: |
          git config user.name "feed-midcar"
          git config user.email "feed@midcar.net"
          git add publico registro.log estado-autocasion.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Autocasion (${{ steps.modo.outputs.modo }}): $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
